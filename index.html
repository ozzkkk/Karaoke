<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131d"><meta name="description" content="Mikrofondan duyduğu şarkıyı tanır, senkronize sözlerini gösterir."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Karaoke</title></head>
<body><main class="app"><header><div class="logo">K</div><div><h1>Karaoke</h1><p>Duy. Tanı. Sözlerle eşlik et.</p></div></header>
<section class="listen-panel"><div class="pulse" id="pulse"><span>♫</span></div><h2 id="status-title">Müziği dinlemeye hazır</h2><p id="status-text">Telefonunu veya bilgisayarını müziğin duyulabileceği bir yere koy.</p><button id="listen-btn" class="listen-btn"><span>●</span> Müziği Dinle</button><p class="hint">Mikrofon izni gerekir · Yaklaşık 8–12 saniye dinler</p></section>
<section class="song" id="song" hidden><img id="cover" alt="Albüm kapağı" src="icon.svg"><div class="song-meta"><strong id="song-title"></strong><span id="song-artist"></span><small id="song-album"></small></div></section>
<section class="lyrics-wrap" id="lyrics-wrap" hidden><div class="lyrics-head"><span>ŞARKI SÖZLERİ</span><span id="sync-label">Senkronize</span></div><div id="lyrics" class="lyrics"><p class="placeholder">Şarkı sözleri burada görünecek.</p></div></section>
<footer><span id="footnote">En iyi sonuç için müziği hoparlörden çal.</span><button id="again-btn" hidden>Yeni şarkı</button></footer></main><script src="app.js"></script></body></html>
